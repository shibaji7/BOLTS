name: docs

# Read the Docs publishes the site; this job makes sure it builds without warnings.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mkdocs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build the docs (strict)
        run: |
          python -m pip install -r docs/requirements.txt
          python -m pip install .
          python -m mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 7
