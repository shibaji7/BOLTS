site_name: BOLTS
site_description: Branching-unit and Optical-repeater power-feed Loop Transient Simulator
repo_url: https://github.com/shibaji7/BOLTS
theme:
  name: material
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://docs.scipy.org/doc/scipy/objects.inv
          options:
            show_root_heading: true
            show_root_full_path: true
            show_source: true
            members_order: source
            docstring_style: google
            docstring_section_style: table
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            merge_init_into_class: true
            group_by_category: true
            show_if_no_docstring: false
            filters: ["!^_"]
            heading_level: 2
markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: .
      check_paths: true
nav:
  - Home: index.md
  - Start here:
      - Install: user/install.md
      - Quick start: user/quickstart.md
      - Command line: user/cli.md
  - The model, chapter by chapter:
